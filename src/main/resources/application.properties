spring.application.name=linkforge

# Actuator configuration
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# H2 Embedded Database configuration
spring.datasource.url=jdbc:h2:mem:linkforgedb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql

# LinkForge LLM configuration (Environment-backed)
linkforge.ai.enabled=${LINKFORGE_AI_ENABLED:false}
linkforge.ai.provider=${LINKFORGE_AI_PROVIDER:ollama}
linkforge.ai.model=${LINKFORGE_AI_MODEL:llama3.2}
linkforge.ai.base-url=${LINKFORGE_AI_BASE_URL:http://localhost:11434}
linkforge.ai.timeout-seconds=${LINKFORGE_AI_TIMEOUT_SECONDS:30}

# Spring AI Ollama configuration
spring.ai.ollama.base-url=${linkforge.ai.base-url}
spring.ai.ollama.chat.options.model=${linkforge.ai.model}
spring.ai.ollama.chat.options.format=json
spring.ai.ollama.chat.options.num-predict=2048
spring.ai.ollama.chat.options.temperature=0.2
spring.ai.ollama.init.pull-model-strategy=never

# Codebase Inspection configuration (Milestone 4)
linkforge.inspection.approved-root=${LINKFORGE_INSPECTION_APPROVED_ROOT:${user.dir}}
linkforge.inspection.max-file-count=${LINKFORGE_INSPECTION_MAX_FILE_COUNT:500}
linkforge.inspection.max-total-size-bytes=${LINKFORGE_INSPECTION_MAX_TOTAL_SIZE_BYTES:10485760}
linkforge.inspection.max-file-size-bytes=${LINKFORGE_INSPECTION_MAX_FILE_SIZE_BYTES:524288}
linkforge.inspection.max-snippet-lines=${LINKFORGE_INSPECTION_MAX_SNIPPET_LINES:40}
linkforge.inspection.max-evidence-files=${LINKFORGE_INSPECTION_MAX_EVIDENCE_FILES:30}

# Specialist Coordination configuration (Milestone 5)
linkforge.coordination.max-concurrency=${LINKFORGE_COORDINATION_MAX_CONCURRENCY:2}
linkforge.coordination.task-timeout-seconds=${LINKFORGE_COORDINATION_TASK_TIMEOUT_SECONDS:10}
linkforge.coordination.max-invocations=${LINKFORGE_COORDINATION_MAX_INVOCATIONS:20}
linkforge.coordination.max-output-chars=${LINKFORGE_COORDINATION_MAX_OUTPUT_CHARS:4000}

# Workflow Security and Authorization Gate (Milestone 6 & 7)
linkforge.workflow.security.enabled=${LINKFORGE_WORKFLOW_SECURITY_ENABLED:false}
linkforge.workflow.security.clarification-token=${LINKFORGE_WORKFLOW_CLARIFICATION_TOKEN:dev-clarification-token}
linkforge.workflow.security.approval-token=${LINKFORGE_WORKFLOW_APPROVAL_TOKEN:dev-approval-token}
linkforge.workflow.security.cancellation-token=${LINKFORGE_WORKFLOW_CANCELLATION_TOKEN:dev-cancellation-token}
linkforge.workflow.security.operator-token=${LINKFORGE_WORKFLOW_OPERATOR_TOKEN:dev-operator-token}

# Bounded Failure Recovery and Exponential Backoff (Milestone 7)
linkforge.workflow.retry.enabled=${LINKFORGE_WORKFLOW_RETRY_ENABLED:true}
linkforge.workflow.retry.max-attempts=${LINKFORGE_WORKFLOW_RETRY_MAX_ATTEMPTS:3}
linkforge.workflow.retry.initial-backoff-ms=${LINKFORGE_WORKFLOW_RETRY_INITIAL_BACKOFF_MS:500}
linkforge.workflow.retry.max-backoff-ms=${LINKFORGE_WORKFLOW_RETRY_MAX_BACKOFF_MS:5000}
linkforge.workflow.retry.backoff-multiplier=${LINKFORGE_WORKFLOW_RETRY_BACKOFF_MULTIPLIER:2.0}

# Governed Execution and Build Validation (Milestone 10)
linkforge.execution.enabled=${LINKFORGE_EXECUTION_ENABLED:true}
linkforge.execution.max-operations=${LINKFORGE_EXECUTION_MAX_OPERATIONS:10}
linkforge.execution.max-file-bytes=${LINKFORGE_EXECUTION_MAX_FILE_BYTES:524288}
linkforge.execution.max-total-bytes=${LINKFORGE_EXECUTION_MAX_TOTAL_BYTES:2097152}
linkforge.execution.build-timeout-seconds=${LINKFORGE_EXECUTION_BUILD_TIMEOUT_SECONDS:60}
linkforge.execution.max-output-chars=${LINKFORGE_EXECUTION_MAX_OUTPUT_CHARS:10000}
linkforge.execution.build-command=${LINKFORGE_EXECUTION_BUILD_COMMAND:./mvnw --batch-mode clean verify}
linkforge.execution.allowed-extensions=${LINKFORGE_EXECUTION_ALLOWED_EXTENSIONS:java,xml,properties,json,md}
linkforge.execution.max-repair-attempts=${LINKFORGE_EXECUTION_MAX_REPAIR_ATTEMPTS:2}
linkforge.execution.container-isolation-available=${LINKFORGE_EXECUTION_CONTAINER_ISOLATION_AVAILABLE:false}

# Jackson Deserialization
spring.jackson.deserialization.fail-on-unknown-properties=true
